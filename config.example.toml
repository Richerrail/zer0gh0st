# ─────────────────────────────────────────────────────────────
#  Zer0│GH0ST — exemple de configuration
#
#  Copie ce fichier vers :   ~/.config/zer0/config.toml
#  puis protège-le :         chmod 600 ~/.config/zer0/config.toml
#
#  Ceci n'est qu'un MODÈLE : rien n'est lu ici automatiquement.
#  Tout est optionnel. Les valeurs sont des exemples commentés.
# ─────────────────────────────────────────────────────────────

# ── Clés API ────────────────────────────────────────────────
# Recommandé : utilise plutôt des variables d'environnement :
#   OPENROUTER_API_KEY, NVIDIA_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, ...
# Tu peux aussi gérer les clés en CLI :
#   zer0 provider add openrouter <clé>
[keys]
# openrouter = "sk-or-..."
# nvidia     = "nvapi-..."

# ── Provider et modèle actifs ───────────────────────────────
# provider = "openrouter"
# model    = "nvidia/nemotron-3.5-lightning:free"

# ── Chaîne de bascule (failover), essayée dans l'ordre ─────
# routes = [
#   "openrouter/nvidia/nemotron-3.5-lightning:free",
#   "openrouter/liquid/lfm-2.5-2.6b:free",
# ]

# ── Rôles : un modèle par type de tâche ────────────────────
# (main, code, reasoning, writing, vision, fast, utility, review)
# [roles]
# main    = "openrouter/nvidia/nemotron-3.5-lightning:free"
# code    = "openrouter/qwen/qwen3-coder:free"
# utility = "openrouter/liquid/lfm-2.5-2.6b:free"

# ── Providers personnalisés (API OpenAI-compatible) ────────
# [custom.mon-serveur]
# name     = "Mon serveur local"
# base_url = "http://localhost:8080/v1"
# env_key  = "MON_SERVEUR_API_KEY"   # optionnel

# ── Mémoire sémantique (embeddings, optionnel) ─────────────
# [embeddings]
# provider = "local"
# model    = "nomic-embed-text"

# ── Contexte du modèle (override manuel, en tokens) ────────
# Utile quand le provider ne rapporte pas la fenêtre de contexte
# (sinon : table de valeurs connues, puis 200k par défaut).
# context_window = 1000000

# ── Bot Telegram ───────────────────────────────────────────
# Préfère ~/.config/zer0/telegram.env (chmod 600) pour le token :
#   ZER0_TELEGRAM_TOKEN=123456:ABC...
# telegram_token = "..."
# telegram_allow = [123456789]

# ── Via la passerelle zer0-gw (aucune clé côté agent) ──────
# Déploiement durci : zer0-gw détient les clés et injecte l'en-tête
# Authorization. L'agent n'appelle que 127.0.0.1 — exfiltrer une clé
# devient impossible (elle n'y est jamais). Voir deploy/ + SAFETY.md §7.
# [custom.gw-openrouter]
# name     = "OpenRouter via zer0-gw"
# base_url = "http://127.0.0.1:8787/openrouter/v1"
#
# [custom.gw-nvidia]
# name     = "NVIDIA via zer0-gw"
# base_url = "http://127.0.0.1:8787/nvidia/v1"
#
# [custom.gw-local]
# name     = "llama-server (loopback direct)"
# base_url = "http://127.0.0.1:8787/local/v1"

# ── Vote 👍/👎 (star GitHub) ────────────────────────────────
# Pour que le pouce haut pose une VRAIE star (1 upvote = 1 star),
# il faut un jeton GitHub. Trois possibilités :
#
# 1) Connexion interactive (recommandé) : `zer0 vote login`
#    → device flow OAuth : GitHub affiche un code, tu le valides dans
#      ton navigateur, le jeton est rangé CHIFFRÉ dans le coffre.
#    → les votes suivants sont automatiques, sans rien demander.
#
# 2) Variable d'environnement (pratique en CI) :
#      export ZER0_GITHUB_TOKEN=ghp_xxx
#
# 3) Ici même (en clair : préfère le coffre !) :
#      [keys]
#      github = "ghp_xxx"
#
# `client_id` de l'application OAuth (device flow). PUBLIC : ce n'est
# pas un secret, seul le client_secret serait confidentiel (et il n'est
# pas nécessaire ici). Alternative : ZER0_GITHUB_CLIENT_ID.
# Par défaut, l'application « Zer0 » est utilisée (client_id ci-dessous) :
# `zer0 vote login` fonctionne donc out of the box, sans configuration.
# github_client_id = "Ov23lioyZzAN5wtt0j0o"
