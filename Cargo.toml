[package]
name = "zer0"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
description = "ZER0|GH0ST - a terminal-native AI agent (CLI-only, Rust)"
authors = ["richerrail"]
license = "MIT"
readme = "README.md"

[lib]
name = "zer0"
path = "src/lib.rs"

[[bin]]
name = "zer0"
path = "src/main.rs"

# Passerelle de clés (optionnelle) : détient les clés API, l'agent n'en voit jamais.
# Build : cargo build --release --features gateway  →  target/release/zer0-gw
[[bin]]
name = "zer0-gw"
path = "src/bin/zer0-gw.rs"
required-features = ["gateway"]

[features]
gateway = ["dep:axum", "tokio/net"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
eventsource-stream = "0.2"
futures-util = "0.3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
sysinfo = "=0.33.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
toml = "0.8"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
rpassword = "7"
sha2 = "0.10"
lopdf = "0.34"
pdf-extract = "0.8"
# Modules fun dynamiques
libloading = "0.8"
notify = "6"
zer0fun-api = { path = "zer0fun-api" }
ed25519-dalek = "2.1"
dirs = "5"
log = "0.4"
# Module email zer0gh0st
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
mail-parser = "0.9"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
# Optionnel — uniquement pour la passerelle zer0-gw (feature "gateway") :
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"], optional = true }

[profile.release]
opt-level = 3
lto = true
