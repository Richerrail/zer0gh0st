name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macOS : les deux archis compilées depuis le runner ARM (SDK universel).
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../zer0-${{ matrix.target }}.tar.gz zer0
          # Binaire brut : ce que télécharge `zer0 update` (pas d'archive à extraire).
          cp zer0 ../../../zer0-${{ matrix.target }}
          cd ../../..
          sha256sum "zer0-${{ matrix.target }}" "zer0-${{ matrix.target }}.tar.gz" \
            > "SHA256SUMS.${{ matrix.target }}"

      - name: Package (Windows → .zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/zer0.exe" `
            -DestinationPath "zer0-${{ matrix.target }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/zer0.exe" "zer0-${{ matrix.target }}.exe"
          $lines = @()
          foreach ($f in @("zer0-${{ matrix.target }}.exe", "zer0-${{ matrix.target }}.zip")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $f"
          }
          $lines | Out-File -Encoding ascii "SHA256SUMS.${{ matrix.target }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # `zer0-<cible>*` (sans point obligatoire) : couvre AUSSI le binaire brut
          # sans extension (Linux/macOS), dont `zer0 update` a besoin.
          files: |
            zer0-${{ matrix.target }}*
            SHA256SUMS.${{ matrix.target }}
          overwrite_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ matrix.target }}
          path: SHA256SUMS.${{ matrix.target }}
          retention-days: 1

  checksums:
    name: SHA256SUMS (agrégé)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sums-*
          merge-multiple: true
          path: sums

      - name: Fusion des checksums
        run: cat sums/SHA256SUMS.* | sort -k2 > SHA256SUMS

      - name: Publier SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS
          overwrite_files: true
