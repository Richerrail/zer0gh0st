
name: ⭐ Étoile

on:
  watch:
    types: [started]

permissions:
  contents: read

jobs:
  star:
    runs-on: ubuntu-latest
    steps:
      - name: Journaliser l'étoile
        run: |
          echo "⭐ ${{ github.event.sender.login }} a mis une étoile." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### ⭐ Nouvelle étoile"
            echo ""
            echo "- **Par** : @${{ github.event.sender.login }}"
            echo "- **Quand** : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "starrer=${{ github.event.sender.login }}" >> "$GITHUB_OUTPUT"
        id: star

      - name: Compteur (étoiles)
        run: |
          total=$(gh api repos/${{ github.repository }}/stargazers --jq '. | length' 2>/dev/null || echo "?")
          echo "Total étoiles : $total" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
