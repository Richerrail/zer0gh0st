name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      # Clippy : un warning échoue le build (le code est maintenu sans warning).
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # Formatage : bloquant. Le code est rustfmt-clean depuis l'extraction de
      # `src/lib.rs` ; laisser ce job « informatif » garantissait la dérive.
      - name: Format
        run: cargo fmt --all -- --check

  gateway:
    name: gateway (zer0-gw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build zer0-gw
        run: cargo build --release --features gateway

      - name: Clippy (gateway)
        run: cargo clippy --all-targets --features gateway -- -D warnings

      - name: Tests (gateway)
        run: cargo test --all-targets --features gateway
