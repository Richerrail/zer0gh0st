[package]
name = "zer0fun-api"
version = "0.1.0"
edition = "2021"
description = "API stable pour les modules fun de zer0gh0st"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ratatui = { version = "0.28", optional = true }

[features]
default = []
# Pour les modules qui veulent des helpers ratatui
ratatui-helpers = ["ratatui"]
